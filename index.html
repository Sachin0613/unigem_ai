<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniGem AI - Gemini 3 Pro Multimodal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-blue: #4ADFFF;
        --neon-cyan: #00E6FF;
        --neon-purple: #A855F7;
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-bg: rgba(15, 23, 42, 0.6);
        --deep-bg: #0B1120; /* Light-black/Deep Slate */
      }
      
      body {
        background-color: var(--deep-bg);
        color: #e2e8f0;
        font-family: 'Outfit', sans-serif;
        overflow-x: hidden;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Rajdhani', sans-serif;
        letter-spacing: 0.02em;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(11, 17, 32, 0.8);
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--neon-cyan);
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      
      @keyframes holo-pulse {
        0% { box-shadow: 0 0 0 0 rgba(74, 223, 255, 0.2); }
        70% { box-shadow: 0 0 0 15px rgba(74, 223, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(74, 223, 255, 0); }
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(30px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      .animate-float { animation: float 8s ease-in-out infinite; }
      .animate-fade-in-up { animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-spin-slow { animation: spin-slow 20s linear infinite; }

      /* Glassmorphism Premium */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .glass-panel:hover {
        background: rgba(30, 41, 59, 0.7);
        border-color: rgba(74, 223, 255, 0.2);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(74, 223, 255, 0.1);
        transform: translateY(-5px) scale(1.02);
      }

      .glass-input {
        background: rgba(11, 17, 32, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: white;
        transition: all 0.3s ease;
      }
      .glass-input:focus {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 20px rgba(0, 230, 255, 0.15);
        background: rgba(11, 17, 32, 0.8);
        outline: none;
      }

      /* Text Effects */
      .neon-text {
        text-shadow: 0 0 30px rgba(74, 223, 255, 0.5);
      }
      .gradient-text {
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      /* Grid Pattern */
      .grid-bg {
        background-size: 80px 80px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        mask-image: radial-gradient(circle at center, black 0%, transparent 80%);
      }

      /* Holographic Rings */
      .holo-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(74, 223, 255, 0.1);
        box-shadow: 0 0 20px rgba(74, 223, 255, 0.05);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",

    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
